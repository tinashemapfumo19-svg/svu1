services:
  postgres:
    image: postgres:16
    container_name: svu-postgres
    environment:
      POSTGRES_DB: svu_rebuild
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - svu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d svu_rebuild"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  svu_postgres_data:
